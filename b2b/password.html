<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password – Farmers &amp; Company</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/b2b/b2b.css">
</head>
<body>
<main style="max-width:520px">
<div class="panel" id="view"></div>
</main>
<script src="/b2b/b2b.js"></script>
<script>
(function () {
  var B = B2B, t = B.t, el = B.el;
  B.header();
  var p = new URLSearchParams(location.search);
  var tokenHash = p.get('t') || '';
  var isNew = p.get('new') === '1';
  // Keep the one-time token out of the address bar and history.
  history.replaceState(null, '', location.pathname + (B.LANG === 'lt' ? '?lang=lt' : ''));
  var view = document.getElementById('view');
  var loginUrl = '/b2b/' + (B.LANG === 'lt' ? '?lang=lt' : '');
  function expired() {
    view.textContent = '';
    view.appendChild(el('p', { class: 'msg bad', role: 'alert', text: t('pExpired') }));
    view.appendChild(el('p', {}, [el('a', { href: loginUrl, text: t('pToLogin') })]));
  }
  if (!tokenHash) return expired();

  var pw1 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '10', required: true });
  var pw2 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '10', required: true });
  var out = el('div', { 'aria-live': 'polite' });
  var session = null;
  var btn = el('button', { type: 'submit', class: 'btn', text: t('pBtn') });
  function bad(text) { out.textContent = ''; out.appendChild(el('p', { class: 'msg bad', role: 'alert', text: text })); }
  view.appendChild(el('form', { style: 'display:flex;flex-direction:column;gap:14px', onsubmit: function (e) {
    e.preventDefault();
    if (pw1.value.length < 10) return bad(t('pShort'));
    if (pw1.value !== pw2.value) return bad(t('pMismatch'));
    btn.disabled = true;
    // 1) exchange the one-time link for a session, 2) set the password.
    // The link works once, so keep the session if the password itself is refused and the visitor tries again.
    var verified = session ? Promise.resolve({ ok: true, data: session }) : B.auth('verify', { type: 'recovery', token_hash: tokenHash });
    verified.then(function (r) {
      if (!r.ok || !r.data.access_token) { expired(); return; }
      session = r.data;
      return B.config().then(function (c) {
        return fetch(c.url + '/auth/v1/user', { method: 'PUT', headers: { apikey: c.key, Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw1.value }) });
      }).then(function (res) {
        if (!res.ok) { btn.disabled = false; return res.json().catch(function () { return {}; }).then(function (d) { bad((d && (d.msg || d.message)) || t('failed')); }); }
        B.save(session);
        location.href = '/b2b/shop.html' + (B.LANG === 'lt' ? '?lang=lt' : '');
      });
    }).catch(function () { btn.disabled = false; bad(t('failed')); });
  } }, [
    el('h2', { class: 'display', style: 'margin:0;font-size:34px', text: isNew ? t('pNew') : t('pReset') }),
    el('p', { style: 'margin:0;color:var(--soft)', text: t('pLead') }),
    el('label', { class: 'f' }, [t('password'), pw1]),
    el('label', { class: 'f' }, [t('pRepeat'), pw2]),
    btn, out
  ]));
})();
</script>
</body>
</html>
