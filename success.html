<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you – Farmers &amp; Company</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500&family=Inter:wght@400;600&display=swap">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E2219;color:#F1EEE4;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55}
main{max-width:560px;padding:48px 24px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
h1{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(40px,7vw,60px);line-height:1.05}
p{margin:0;color:#D5DACF}
a{color:#F1EEE4}
.btn{display:inline-block;text-decoration:none;background:#8FD3A8;color:#0E2219;padding:15px 30px;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
a:focus-visible{outline:2px solid #8FD3A8;outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="/img/logo_light.png" alt="Farmers &amp; Company" style="height:140px;width:auto;margin-bottom:12px">
<h1 data-t="h">Thank you for your order</h1>
<p data-t="p1">Your payment went through, and a receipt is on its way to your email. We deliver your caviar chilled within 3 working days.</p>
<p data-t="p2">Questions? Write to us at <a href="mailto:sp@farmersandcompany.lt">sp@farmersandcompany.lt</a>.</p>
<p style="font-size:14px" data-t="p3">Read our <a href="/terms.html">terms of sale</a> and <a href="/privacy.html">privacy policy</a>.</p>
<a class="btn" href="/" data-t="btn">Back to the shop</a>
</main>
<script>
try { localStorage.removeItem('fc-caviar-cart'); } catch (e) {}
(function () {
  var lt = /[?&]lang=lt\b/.test(location.search);
  if (!lt) return;
  var T = {
    h: 'Dėkojame už užsakymą',
    p1: 'Jūsų mokėjimas gautas, o kvitas jau keliauja į jūsų el. paštą. Ikrus atvėsintus pristatysime per 3 darbo dienas.',
    p2: 'Turite klausimų? Rašykite mums adresu <a href="mailto:sp@farmersandcompany.lt">sp@farmersandcompany.lt</a>.',
    p3: 'Susipažinkite su mūsų <a href="/terms-lt.html">pardavimo taisyklėmis</a> ir <a href="/privacy-lt.html">privatumo politika</a>.',
    btn: 'Grįžti į parduotuvę'
  };
  document.documentElement.lang = 'lt'; document.title = 'Ačiū – Farmers & Company';
  document.querySelectorAll('[data-t]').forEach(function (n) { n.innerHTML = T[n.getAttribute('data-t')]; });
  document.querySelector('.btn').setAttribute('href', '/?lang=lt');
})();
</script>
</body>
</html>
